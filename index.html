<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한눈에 둘러보기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&display=swap">
</head>
<body>

<!-- ═════════ [독립 페이지 전용] 메이크샵에 넣을 때는 이 style 한 덩어리만 뺍니다 ═════════ -->
<style>
body{margin:0;background:#f5f6f8}
#qb{--qb-font:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
</style>

<!-- ═════════ [1] CSS — 모든 규칙이 #qb 안에서만 적용되어 쇼핑몰 기존 디자인과 섞이지 않습니다 ═════════ -->
<style>
/* 레이아웃: ① 취향 고르는 화면(질문 묶음 + 하단 고정 추천 버튼) → ② 추천 결과 화면(상단 고정줄 + 끝없는 상품 격자) */
#qb{
  --qb-bg:#f5f6f8; --qb-card:#ffffff; --qb-fg:#14171c; --qb-muted:#676e79; --qb-line:#dfe3e8;
  --qb-accent:#0f6b5c; --qb-accent-fg:#ffffff; --qb-sale:#c2362b; --qb-soft:#e4f1ee;
  --qb-top:0px;      /* 쇼핑몰 상단 고정 메뉴 높이만큼 */
  --qb-bottom:0px;   /* 쇼핑몰 하단 고정 메뉴 높이만큼 */
  --qb-info-h:84px;
  background:var(--qb-bg);color:var(--qb-fg);font-family:var(--qb-font,inherit);font-size:14px;line-height:1.45;text-align:left}
#qb *{box-sizing:border-box}
#qb [hidden]{display:none!important}
#qb button{font-family:inherit;cursor:pointer}
#qb button:focus-visible,#qb input:focus-visible,#qb select:focus-visible,#qb a:focus-visible{outline:2px solid var(--qb-accent);outline-offset:2px}

/* ① 취향 화면 */
#qb .qb-pick{max-width:600px;margin:0 auto;padding:22px 16px calc(120px + var(--qb-bottom));display:flex;flex-direction:column;gap:22px}
#qb .qb-head h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.03em;text-wrap:balance;color:var(--qb-fg)}
#qb .qb-head p{margin:0;color:var(--qb-muted)}
#qb .qb-q{display:flex;flex-direction:column;gap:9px}
#qb .qb-q h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--qb-fg)}
#qb .qb-q h2 small{font-weight:400;font-size:12px;color:var(--qb-muted);margin-left:6px}
#qb .qb-chips{display:flex;flex-wrap:wrap;gap:7px}
#qb .qb-chip{border:1px solid var(--qb-line);background:var(--qb-card);color:var(--qb-fg);font-weight:600;font-size:14px;padding:9px 14px;border-radius:999px}
#qb .qb-chip[aria-pressed="true"]{background:var(--qb-accent);border-color:var(--qb-accent);color:var(--qb-accent-fg)}
#qb .qb-kw{width:100%;font:400 15px var(--qb-font,inherit);color:var(--qb-fg);background:var(--qb-card);border:1px solid var(--qb-line);border-radius:10px;padding:12px 14px}

#qb .qb-photo{background:var(--qb-card);border:1px dashed var(--qb-line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
#qb .qb-photo-btns{display:flex;gap:8px;flex-wrap:wrap}
#qb .qb-photo-btns label,#qb .qb-ghost{flex:1 1 130px;text-align:center;border:1px solid var(--qb-line);background:var(--qb-bg);color:var(--qb-fg);font-weight:600;font-size:14px;padding:11px 12px;border-radius:10px;cursor:pointer}
#qb .qb-photo-btns label:focus-within{outline:2px solid var(--qb-accent);outline-offset:2px}
#qb .qb-photo input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
#qb .qb-photo-got{display:flex;gap:12px;align-items:center}
#qb .qb-photo-got img{width:76px;height:76px;object-fit:cover;border-radius:10px;flex:none}
#qb .qb-photo-got div{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
#qb .qb-tone{display:flex;align-items:center;gap:7px;font-size:13px}
#qb .qb-tone i{width:18px;height:18px;border-radius:5px;border:1px solid var(--qb-line);flex:none}
#qb .qb-photo-got .qb-ghost{flex:none;padding:6px 12px;font-size:12.5px;align-self:flex-start}
#qb .qb-hint{color:var(--qb-muted);font-size:12px;margin:0}

#qb .qb-cta{position:fixed;left:0;right:0;bottom:var(--qb-bottom);z-index:60;background:var(--qb-bg);border-top:1px solid var(--qb-line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
#qb .qb-cta div{max-width:568px;margin:0 auto;display:flex;gap:8px}
#qb .qb-cta button{flex:1;border-radius:12px;padding:14px 8px;font-size:15px;font-weight:800;border:1px solid var(--qb-accent)}
#qb .qb-b1,#qb .qb-b0{background:var(--qb-card);color:var(--qb-accent)}
#qb .qb-cta .qb-b0{flex:0 0 auto;padding-inline:14px}
#qb .qb-cta button{white-space:nowrap}
#qb .qb-b2{background:var(--qb-accent);color:var(--qb-accent-fg)}

/* ② 결과 화면 */
#qb .qb-res{max-width:1500px;margin:0 auto;padding:0 16px calc(96px + var(--qb-bottom))}
#qb .qb-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--qb-top));z-index:50;background:var(--qb-bg);margin:0 -16px;padding:10px 16px 8px;border-bottom:1px solid var(--qb-line);display:flex;flex-direction:column;gap:8px}
#qb .qb-bar-top,#qb .qb-bar-bot{display:flex;align-items:center;justify-content:space-between;gap:10px}
#qb .qb-bar h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--qb-fg)}
#qb .qb-back{border:1px solid var(--qb-line);background:var(--qb-card);color:var(--qb-fg);font-weight:600;font-size:13px;padding:7px 12px;border-radius:999px;flex:none}
#qb .qb-sum{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;align-items:center}
#qb .qb-sum::-webkit-scrollbar{display:none}
#qb .qb-sum span{flex:none;background:var(--qb-soft);color:var(--qb-fg);font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
#qb .qb-sum img{flex:none;width:26px;height:26px;border-radius:6px;object-fit:cover}
#qb .qb-pos{font-variant-numeric:tabular-nums;color:var(--qb-muted);font-size:13px}
#qb .qb-pos b{color:var(--qb-fg);font-weight:800}
#qb .qb-bar-bot select{font:400 13px var(--qb-font,inherit);color:var(--qb-fg);background:var(--qb-card);border:1px solid var(--qb-line);border-radius:8px;padding:5px 8px}
#qb .qb-bar-bot label{color:var(--qb-muted);font-size:12px;display:flex;align-items:center;gap:6px}
#qb .qb-track{height:3px;background:var(--qb-line);border-radius:2px;overflow:hidden}
#qb .qb-track i{display:block;height:100%;width:0;background:var(--qb-accent)}
#qb .qb-note{color:var(--qb-muted);font-size:12px;margin:10px 0 12px}

#qb .qb-list{position:relative}
#qb .qb-item{position:absolute;top:0;left:0;display:block;background:var(--qb-card);border-radius:10px;overflow:hidden;contain:layout paint;color:var(--qb-fg);text-decoration:none}
#qb .qb-ph{position:relative;width:100%;aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden}
#qb .qb-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#qb .qb-ph i{display:block;width:44%;aspect-ratio:1;border-style:solid;border-width:5px}
#qb .qb-no{position:absolute;left:6px;top:6px;z-index:1;font-size:10px;font-weight:600;color:#14171c;background:rgba(255,255,255,.78);padding:1px 6px;border-radius:999px;font-variant-numeric:tabular-nums}
#qb .qb-info{height:var(--qb-info-h);padding:8px 10px;display:flex;flex-direction:column;gap:3px}
#qb .qb-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#qb .qb-price{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#qb .qb-price s{font-weight:400;font-size:12px;color:var(--qb-muted);margin-left:5px}
#qb .qb-price em{font-style:normal;color:var(--qb-sale);margin-right:4px}
#qb .qb-opts{display:flex;align-items:center;gap:6px;color:var(--qb-muted);font-size:11.5px;white-space:nowrap;overflow:hidden}
#qb .qb-dots{display:flex;flex:none}
#qb .qb-dots span{width:11px;height:11px;border-radius:50%;border:1px solid var(--qb-line);margin-right:-3px}
#qb .qb-top{position:fixed;right:16px;bottom:calc(16px + var(--qb-bottom) + env(safe-area-inset-bottom,0px));z-index:60;border:0;background:var(--qb-fg);color:var(--qb-bg);font-weight:600;font-size:13px;padding:10px 14px;border-radius:999px}
</style>

<!-- ═════════ [2] HTML — 메이크샵 개별 페이지의 본문 자리에 그대로 들어가는 부분 ═════════ -->
<div id="qb">
  <div class="qb-pick" id="qb-pick">
    <div class="qb-head">
      <h1>당신의 취향을 알려주세요</h1>
      <p>고른 만큼 더 잘 맞는 상품부터 보여드립니다. 안 골라도 괜찮습니다.</p>
    </div>

    <div class="qb-q"><h2>어떤 걸 찾으세요?<small>여러 개 선택</small></h2><div class="qb-chips" data-qb-group="item"></div></div>
    <div class="qb-q"><h2>소재<small>여러 개 선택</small></h2><div class="qb-chips" data-qb-group="material"></div></div>
    <div class="qb-q"><h2>피어싱 형태<small>여러 개 선택</small></h2><div class="qb-chips" data-qb-group="shape"></div></div>
    <div class="qb-q"><h2>착용 부위<small>여러 개 선택</small></h2><div class="qb-chips" data-qb-group="spot"></div></div>
    <div class="qb-q"><h2>가격대<small>하나만</small></h2><div class="qb-chips" data-qb-group="price"></div></div>

    <div class="qb-q">
      <h2>검색어<small>선택</small></h2>
      <input class="qb-kw" id="qb-kw" type="search" placeholder="예: 하트, 큐빅, 진주" autocomplete="off">
    </div>

    <div class="qb-q">
      <h2>사진으로 찾기<small>선택</small></h2>
      <div class="qb-photo">
        <div class="qb-photo-btns" id="qb-photo-btns">
          <label>사진 찍기<input id="qb-cam" type="file" accept="image/*" capture="environment"></label>
          <label>앨범에서 고르기<input id="qb-album" type="file" accept="image/*"></label>
        </div>
        <div class="qb-photo-got" id="qb-photo-got" hidden>
          <img id="qb-photo-img" alt="넣은 사진">
          <div>
            <div class="qb-tone"><i id="qb-tone-sw"></i><span id="qb-tone-tx"></span></div>
            <button class="qb-ghost" id="qb-photo-del" type="button">사진 빼기</button>
          </div>
        </div>
        <p class="qb-hint">마음에 드는 제품 사진을 넣으면 비슷한 색의 상품부터 보여드립니다. 사진은 이 기기 안에서만 쓰이고 어디에도 올라가지 않습니다.</p>
      </div>
    </div>

    <div class="qb-cta"><div>
      <button class="qb-b0" type="button" data-qb-n="0">전체</button>
      <button class="qb-b1" type="button" data-qb-n="500">500개 추천받기</button>
      <button class="qb-b2" type="button" data-qb-n="1000">1,000개 추천받기</button>
    </div></div>
  </div>

  <div class="qb-res" id="qb-res" hidden>
    <div class="qb-bar">
      <div class="qb-bar-top">
        <h1 id="qb-title">추천</h1>
        <button class="qb-back" id="qb-back" type="button">취향 다시 고르기</button>
      </div>
      <div class="qb-sum" id="qb-sum"></div>
      <div class="qb-bar-bot">
        <div class="qb-pos"><b id="qb-now">1</b>번째 / <span id="qb-all">0</span>개</div>
        <label>크기
          <select id="qb-size">
            <option value="104">작게</option>
            <option value="150" selected>보통</option>
            <option value="220">크게</option>
          </select>
        </label>
      </div>
      <div class="qb-track"><i id="qb-prog"></i></div>
    </div>
    <p class="qb-note" id="qb-note"></p>
    <div class="qb-list" id="qb-list"></div>
    <button class="qb-top" id="qb-top" type="button">맨 위로</button>
  </div>
</div>

      var m=/^#?([0-9a-f]{6})$/i.exec(p.colors[k]);if(!m)continue;
      var v=parseInt(m[1],16),r=(v>>16)/255,g=(v>>8&255)/255,b=(v&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),df=mx-mn;
      if(df<0.25)continue;
      var h=mx===r?((g-b)/df)%6:mx===g?(b-r)/df+2:(r-g)/df+4;p.hue=(h*60+360)%360;p.grey=false;break;
    }
    return p;
  }
  function unpack(r,i){
    var spots=[];MENU.spot.forEach(function(s,k){if(r[9]>>k&1)spots.push(s)});
    return tone({id:r[0],name:r[1],price:r[2],listPrice:r[3],image:r[4]?CONFIG.siteBase+CONFIG.imgBase+r[4]:'',
      colors:r[5].map(function(c){return '#'+c}),item:MENU.item[r[6]]||'',material:MENU.material[r[7]]||'',
      shape:MENU.shape[r[8]]||'',spots:spots,sizes:0,round:true,rot:0,j:((i*2654435761)>>>0)/4294967296},i);
  }
  function sample(n){
    var seed=20261013,r=function(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
    var pick=function(a){return a[Math.floor(r()*a.length)]};
    var MOTIF=['하트','별','큐빅','진주','리본','나비','문','플라워','미니','베이직','체인','오팔'];
    var CN=Object.keys(COLORS),RANGE={'써지컬스틸':[1500,14000],'925실버':[6000,32000],'14k골드':[28000,140000],'기타 소재':[1000,9000]};
    var SIZES={'반지/토우링':5,'피어싱':3,'목걸이':2,'팔찌/발찌':2},out=new Array(n);
    for(var i=0;i<n;i++){
      var item=r()<0.45?'피어싱':pick(MENU.item),mat=pick(MENU.material),pierce=item==='피어싱';
      var shape=pierce?pick(MENU.shape):'',spots=[];
      if(pierce){var s0=Math.floor(r()*MENU.spot.length);spots.push(MENU.spot[s0]);if(r()<0.4)spots.push(MENU.spot[(s0+1)%MENU.spot.length])}
      var rg=RANGE[mat],base=Math.round((rg[0]+r()*r()*(rg[1]-rg[0]))/100)*100,sale=r()<0.22?Math.floor(r()*5+1)*10:0;
      var nc=Math.floor(r()*4)+1,st=Math.floor(r()*CN.length),cols=[];
      for(var c=0;c<nc;c++)cols.push(COLORS[CN[(st+c)%CN.length]][0]);
      var main=COLORS[CN[st]];
      out[i]={id:100000+i,name:pick(MOTIF)+' '+(mat==='기타 소재'?'':mat+' ')+(pierce?shape+' 피어싱':item.split('/')[0]),
        price:sale?Math.round(base*(100-sale)/1000)*10:base,listPrice:sale?base:0,image:'',
        item:item,material:mat,shape:shape,spots:spots,colors:cols,sizes:SIZES[item]?Math.floor(r()*SIZES[item])+1:0,
        hue:main[1]<0?Math.floor(r()*360):(main[1]+Math.floor(r()*30)-15+360)%360,grey:main[1]<0,
        round:r()<0.6,rot:Math.floor(r()*4)*45,j:r()};
    }
    return out;
  }

  var root=document.getElementById('qb');if(!root)return;
  var $=function(id){return document.getElementById('qb-'+id)};
  var all=[],items=[],isSample=true,photo=null;
  var sel={item:{},material:{},shape:{},spot:{},price:-1};
  var has=function(o){for(var k in o)if(o[k])return true;return false};

  /* ── 취향 버튼 ── */
  root.querySelectorAll('[data-qb-group]').forEach(function(box){
    var key=box.getAttribute('data-qb-group'),single=key==='price';
    MENU[key].forEach(function(v,idx){
      var name=single?v[0]:v,b=document.createElement('button');
      b.type='button';b.className='qb-chip';b.textContent=name;b.setAttribute('aria-pressed','false');
      b.addEventListener('click',function(){
        if(single){
          var on=sel.price===idx;sel.price=on?-1:idx;
          box.querySelectorAll('.qb-chip').forEach(function(x){x.setAttribute('aria-pressed','false')});
          b.setAttribute('aria-pressed',String(!on));
        }else{sel[key][name]=!sel[key][name];b.setAttribute('aria-pressed',String(sel[key][name]))}
      });
      box.appendChild(b);
    });
  });

  /* ── 사진 → 대표 색 (기기 안에서만 계산) ── */
  function readPhoto(file){
    if(!file)return;
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var c=document.createElement('canvas');c.width=c.height=48;
        var x=c.getContext('2d');x.drawImage(img,0,0,48,48);
        var d=x.getImageData(0,0,48,48).data,sx=0,sy=0,sw=0,R=0,G=0,B=0,n=d.length/4,ss=0;
        for(var i=0;i<d.length;i+=4){
          var r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),df=mx-mn;
          R+=d[i];G+=d[i+1];B+=d[i+2];
          var l=(mx+mn)/2,s=df===0?0:df/(1-Math.abs(2*l-1)||1);ss+=s;
          if(df>0.08){var h=mx===r?((g-b)/df)%6:mx===g?(b-r)/df+2:(r-g)/df+4;h*=Math.PI/3;sx+=Math.cos(h)*s;sy+=Math.sin(h)*s;sw+=s}
        }
        var hue=(Math.atan2(sy,sx)*180/Math.PI+360)%360,grey=ss/n<0.12||sw===0;
        photo={src:fr.result,hue:hue,grey:grey};
        $('photo-img').src=photo.src;
        $('tone-sw').style.background=grey?'rgb('+Math.round(R/n)+','+Math.round(G/n)+','+Math.round(B/n)+')':'hsl('+Math.round(hue)+',55%,55%)';
        $('tone-tx').textContent=grey?'대표 색: 무채색 계열 (실버·블랙·화이트 상품 우선)':'대표 색을 찾았습니다. 이 색과 가까운 상품 우선';
        $('photo-got').hidden=false;$('photo-btns').hidden=true;
      };
      img.onerror=function(){$('tone-tx').textContent='이 사진은 읽을 수 없습니다. 다른 사진을 골라 주세요.';$('photo-got').hidden=false};
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  }
  $('cam').addEventListener('change',function(){readPhoto(this.files[0]);this.value=''});
  $('album').addEventListener('change',function(){readPhoto(this.files[0]);this.value=''});
  $('photo-del').addEventListener('click',function(){photo=null;$('photo-got').hidden=true;$('photo-btns').hidden=false;$('photo-img').removeAttribute('src')});

  /* ── 추천: 취향에 맞는 만큼 점수를 주고 높은 순으로 N개 ── */
  function recommend(n){
    var kw=$('kw').value.trim(),pr=sel.price>=0?MENU.price[sel.price]:null;
    var fi=has(sel.item),fm=has(sel.material),fs=has(sel.shape),fp=has(sel.spot);
    var scored=all.map(function(p){
      var s=p.j*0.9,i;
      if(fi&&sel.item[p.item])s+=4;
      if(fm&&sel.material[p.material])s+=3;
      if(fs&&sel.shape[p.shape])s+=3;
      if(fp){for(i=0;i<p.spots.length;i++)if(sel.spot[p.spots[i]]){s+=3;break}}
      if(pr&&p.price>pr[1]&&p.price<=pr[2])s+=3;
      if(kw&&p.name.indexOf(kw)>=0)s+=6;
      if(photo){
        if(photo.grey){if(p.grey)s+=4}
        else if(!p.grey){var d=Math.abs(p.hue-photo.hue);d=Math.min(d,360-d);s+=Math.max(0,5-d/12)}
      }
      return [s,p];
    });
    scored.sort(function(a,b){return b[0]-a[0]});
    return (n?scored.slice(0,n):scored).map(function(x){return x[1]});
  }
  function summary(){
    var box=$('sum'),t=[],k;box.textContent='';
    if(photo){var im=document.createElement('img');im.src=photo.src;im.alt='넣은 사진';box.appendChild(im)}
    ['item','material','shape','spot'].forEach(function(g){for(k in sel[g])if(sel[g][k])t.push(k)});
    if(sel.price>=0)t.push(MENU.price[sel.price][0]);
    var kw=$('kw').value.trim();if(kw)t.push('"'+kw+'"');
    if(!t.length&&!photo)t.push('취향 선택 없음 · 전체에서 추천');
    t.forEach(function(x){var s=document.createElement('span');s.textContent=x;box.appendChild(s)});
  }

  /* ── 끝없는 스크롤: 화면에 보이는 줄만 그리고 지나간 카드는 지웁니다 ── */
  var list=$('list'),cols=2,cardW=0,rowH=0,gap=10,infoH=84,live={},raf=0;
  var won=function(n){return n.toLocaleString('ko-KR')+'원'};
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function card(p,rank){
    var a=el(isSample?'div':'a','qb-item');
    if(!isSample){a.href=CONFIG.siteBase+CONFIG.linkBase+encodeURIComponent(p.id);if(CONFIG.siteBase){a.target='_blank';a.rel='noopener'}}
    var ph=el('div','qb-ph');
    ph.style.background=p.grey?'hsl('+p.hue+',8%,86%)':'hsl('+p.hue+',38%,85%)';
    ph.appendChild(el('span','qb-no',rank));
    if(p.image){
      var im=new Image();im.loading='lazy';im.decoding='async';im.alt='';
      im.onerror=function(){im.remove()};im.src=p.image;ph.appendChild(im);
    }else{
      var sh=el('i');sh.style.borderColor=p.grey?'hsl('+p.hue+',6%,40%)':'hsl('+p.hue+',36%,42%)';
      sh.style.borderRadius=p.round?'50%':'18%';sh.style.transform='rotate('+p.rot+'deg)';ph.appendChild(sh);
    }
    var info=el('div','qb-info'),nm=el('div','qb-name',p.name);nm.title=p.name;
    var pr=el('div','qb-price');
    if(p.listPrice>p.price)pr.appendChild(el('em','',Math.round((1-p.price/p.listPrice)*100)+'%'));
    pr.appendChild(document.createTextNode(won(p.price)));
    if(p.listPrice>p.price)pr.appendChild(el('s','',won(p.listPrice)));
    var op=el('div','qb-opts'),dots=el('span','qb-dots');
    p.colors.slice(0,8).forEach(function(c){var d=el('span');d.style.background=c;dots.appendChild(d)});
    var txt=[];if(p.colors.length)txt.push('색상 '+p.colors.length+'종');if(p.sizes)txt.push('사이즈 '+p.sizes+'종');
    op.appendChild(dots);op.appendChild(el('span','',txt.join(' · ')));
    info.appendChild(nm);info.appendChild(pr);info.appendChild(op);
    a.appendChild(ph);a.appendChild(info);
    return a;
  }
  function clear(){for(var k in live){live[k].remove()}live={}}
  function layout(){
    var W=list.clientWidth,min=+$('size').value;
    cols=Math.max(2,Math.floor((W+gap)/(min+gap)));
    cardW=(W-gap*(cols-1))/cols;rowH=cardW*1.25+infoH+gap;
    list.style.height=Math.max(0,Math.ceil(items.length/cols)*rowH-gap)+'px';
    clear();$('all').textContent=items.length.toLocaleString('ko-KR');draw();
  }
  function draw(){
    raf=0;if($('res').hidden)return;
    var top=-list.getBoundingClientRect().top,vh=window.innerHeight,buf=vh;
    var i0=Math.max(0,Math.floor((top-buf)/rowH))*cols,i1=Math.min(items.length,Math.ceil((top+vh+buf)/rowH)*cols),k,i;
    for(k in live){if(+k<i0||+k>=i1){live[k].remove();delete live[k]}}
    var frag=document.createDocumentFragment();
    for(i=i0;i<i1;i++){
      if(live[i])continue;
      var c=card(items[i],i+1);
      c.style.width=cardW+'px';
      c.style.transform='translate('+((i%cols)*(cardW+gap))+'px,'+(Math.floor(i/cols)*rowH)+'px)';
      live[i]=c;frag.appendChild(c);
    }
    list.appendChild(frag);
    var cur=items.length?Math.min(items.length,Math.max(1,Math.floor(Math.max(0,top)/rowH)*cols+1)):0;
    $('now').textContent=cur.toLocaleString('ko-KR');
    $('prog').style.width=(items.length?Math.min(100,cur/items.length*100):0)+'%';
  }
  function toTop(){var y=root.getBoundingClientRect().top+window.pageYOffset;window.scrollTo(0,Math.max(0,y))}

  function show(n){
    items=recommend(n);
    $('title').textContent=(n?'추천 ':'전체 ')+items.length.toLocaleString('ko-KR')+'개';summary();
    $('note').textContent=isSample
      ?'예시 상품 '+all.length.toLocaleString('ko-KR')+'개 중에서 고른 결과입니다. 사진·상품명·가격은 모두 가짜 데이터이고, 왼쪽 위 숫자는 추천 순위입니다.'
      :'실제 상품 '+all.length.toLocaleString('ko-KR')+'개를 취향에 맞는 순서로 늘어놓았습니다. 카드를 누르면 상품 페이지가 열립니다.';
    $('pick').hidden=true;$('res').hidden=false;toTop();layout();
  }
  root.querySelectorAll('[data-qb-n]').forEach(function(b){
    var label=b.textContent;
    b.addEventListener('click',function(){
      var n=+b.getAttribute('data-qb-n');
      if(all.length){show(n);return}
      b.textContent='상품을 불러오는 중입니다';
      loadProducts(function(rows,smp){all=rows;isSample=smp;b.textContent=label;show(n)},
        function(){b.textContent='상품을 못 불러왔습니다. 다시 눌러 주세요'});
    });
  });
  $('back').addEventListener('click',function(){$('res').hidden=true;$('pick').hidden=false;toTop()});
  $('size').addEventListener('change',layout);
  $('top').addEventListener('click',toTop);
  window.addEventListener('scroll',function(){if(!raf)raf=requestAnimationFrame(draw)},{passive:true});
  window.addEventListener('resize',function(){if(!$('res').hidden)layout()});
})();
</script>
